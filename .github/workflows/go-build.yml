name: Go build
#
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
#
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26.x', '1.27.x' ]
    steps:
    - uses: actions/checkout@v4
    #
    - name: Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
    #
    - name: Build HWM Go Utils
      run: go build -v ./...
    #
#