name: Go test workflow
on:
  push:
  pull_request:
    branches: [ "main" ]
#
env:
  APP_ENV: runner
#
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26.x', '1.27.x' ]
    #
    steps:
      - uses: actions/checkout@v4
      #
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      #
      # You can test your matrix by printing the current Go version
      - name: Display Go version
        run: go version
      #
      - name: Check go.mod/go.sum are tidy
        run: go mod tidy -diff
      #
      - name: Build
        run: go build -v ./... 
      #
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      #
      - name: Vet
        run: go vet ./...
      #
      # Unit tests: the Keycloak integration tests skip without KEYCLOAK_SERVER
      - name: Test with the Go CLI
        run: go test -race -v ./...
      #
      # Integration tests against the real Keycloak server from the repo secrets.
      # Non-blocking: they depend on external infrastructure, so a failure shows
      # up as a warning annotation on the run instead of a failed check.
      - name: Keycloak integration tests (non-blocking)
        continue-on-error: true
        env:
          KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
          KEYCLOAK_SERVER: ${{ secrets.KEYCLOAK_SERVER }}
          KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
        run: go test -v -run 'TestAPI|TestIKeycloak' ./keycloak/
      #
    #
  #