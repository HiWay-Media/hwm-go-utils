title: hwm-go-utils
description: >-
  Batteries-included Go toolkit from HiWay Media: secure REST scaffolding for
  Fiber + GORM, Keycloak JWT auth, and production-ready clients for Keycloak,
  Nomad, NATS, MySQL and Redis.
url: "https://hiway-media.github.io"
baseurl: "/hwm-go-utils"
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude: ["Gemfile", "Gemfile.lock", "README.md", "vendor/", ".jekyll-cache/"]

logo: "/assets/images/logo.svg"
favicon_ico: "/assets/images/favicon.svg"
color_scheme: hwm

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
enable_copy_code_button: true

mermaid:
  version: "11.4.1"

aux_links:
  "GitHub":
    - "https://github.com/HiWay-Media/hwm-go-utils"
  "pkg.go.dev":
    - "https://pkg.go.dev/github.com/HiWay-Media/hwm-go-utils"
aux_links_new_tab: true

nav_sort: case_insensitive
back_to_top: true
back_to_top_text: "Back to top"

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Behaviour change
    color: yellow
  important:
    title: Security
    color: red

footer_content: >-
  Copyright &copy; 2022-present HiWay Media.
  Distributed under the <a href="https://github.com/HiWay-Media/hwm-go-utils/blob/main/LICENSE">MIT license</a>.

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/HiWay-Media/hwm-go-utils"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
